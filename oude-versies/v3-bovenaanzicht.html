<title>Autolichten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: nachtscène van boven links (plakt vast), schakelaars en situaties rechts. Op een telefoon staat de scène bovenaan en blijft zichtbaar tijdens het scrollen. */
:root{
  --bg:#0a0f1f;
  --panel:#121a31;
  --line:#2b3860;
  --text:#eef2ff;
  --muted:#a6b3d3;
  --green:#3ddc84;
  --blue:#5aa2ff;
  --amber:#ffb224;
  --alert:#ff5a5f;
  --focus:#ffd166;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"B612 Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.page{
  max-width:1180px;margin:0 auto;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.top .logo{width:58px;height:40px;color:var(--amber);flex:none}
.top h1{margin:0;font-size:clamp(26px,6vw,36px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:15px}

.app{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.stage{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--bg);padding-block:6px;
  display:flex;justify-content:center;
}
.stagebox{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);line-height:0;background:#05081a}
svg.scene{display:block;height:clamp(300px,52svh,560px);width:auto;aspect-ratio:9/16;max-width:100%}

.readout{
  position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:8px;
  padding:6px 12px 6px 9px;border-radius:99px;line-height:1.2;
  background:rgba(10,15,31,.82);border:1px solid var(--line);
}
.readout svg{width:22px;height:22px;color:var(--muted)}
.readout output{font-family:var(--mono);font-weight:700;font-size:17px;white-space:nowrap}
.warn{
  position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px;
  padding:6px 12px 6px 9px;border-radius:99px;line-height:1.2;
  background:var(--alert);color:#fff;font-weight:700;font-size:15px;
}
.warn[hidden]{display:none}
.warn svg{width:20px;height:20px}

.panel{display:grid;gap:28px;min-width:0}
.h{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.lights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.light{
  --c:var(--green);
  display:grid;grid-template-columns:1fr auto;
  grid-template-areas:"ico sw" "name name" "hint hint" "dist dist";
  align-items:center;row-gap:6px;column-gap:8px;min-width:0;
  text-align:left;padding:14px 14px 12px;
  background:var(--panel);border:2px solid var(--line);border-radius:14px;
  transition:border-color .2s,background-color .2s;
}
.light.blue{--c:var(--blue)}
.light.amber{--c:var(--amber)}
.light .ico{grid-area:ico;width:56px;height:38px;color:#6c7aa3;transition:color .2s,filter .2s}
.light .sw{grid-area:sw;width:46px;height:26px;border-radius:99px;background:#2a3558;position:relative;transition:background-color .2s}
.light .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8b98bd;transition:transform .2s,background-color .2s}
.light .name{grid-area:name;font-weight:600;font-size:17px}
.light .hint{grid-area:hint;color:var(--muted);font-size:14px}
.light .dist{grid-area:dist;font-family:var(--mono);font-weight:700;font-size:15px}
.light[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.light[aria-pressed="true"] .ico{color:var(--c);filter:drop-shadow(0 0 7px var(--c))}
.light[aria-pressed="true"] .sw{background:var(--c)}
.light[aria-pressed="true"] .sw::after{transform:translateX(20px);background:var(--bg)}

.alloff{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:14px;background:transparent;border:2px dashed var(--line);border-radius:14px;color:var(--muted);
  font-weight:600;font-size:16px;transition:border-color .2s,color .2s;
}
.alloff svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.alloff:hover{border-color:var(--muted);color:var(--text)}

.sits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sit{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 12px;
  background:var(--panel);border:2px solid var(--line);border-radius:14px;font-weight:600;font-size:16px;
  transition:border-color .2s,background-color .2s;
}
.sit svg{width:38px;height:38px;color:var(--muted);transition:color .2s}
.sit[aria-pressed="true"]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,var(--panel))}
.sit[aria-pressed="true"] svg{color:var(--amber)}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:9px;padding:10px 18px 10px 14px;
  background:var(--panel);border:2px solid var(--line);border-radius:99px;font-weight:500;font-size:16px;
  transition:border-color .2s,background-color .2s;
}
.chip svg{width:26px;height:26px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--panel))}
.chip[aria-pressed="true"] svg{color:var(--blue)}

.i24{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- scène: alles wordt gestuurd met klassen op #scene ---- */
#scene .m,#scene .g,#scene .halo,#scene .onc-only,#scene .dazzle,#scene .fogveil,#scene .fogcut{opacity:0;transition:opacity .35s}
#scene.s-stand .m-stand,#scene.s-stand .g-stand{opacity:1}
#scene.s-dim .m-dim,#scene.s-dim .g-dim{opacity:1}
#scene.s-groot .m-groot,#scene.s-groot .g-groot{opacity:1}
#scene.s-mistf .m-mistf,#scene.s-mistf .g-mistf{opacity:1}
#scene.s-onc .onc-only{opacity:1}
#scene.s-fog .fogveil,#scene.s-fog .fogcut{opacity:1}

#scene .bulb{fill:#252e4d;transition:fill .3s}
#scene.s-stand .bulb{fill:#ffe39a}
#scene.s-dim .bulb{fill:#fff6da}
#scene.s-groot .bulb{fill:#eaf2ff}
#scene .fogf{fill:#252e4d;transition:fill .3s}
#scene.s-mistf .fogf{fill:#fff0b0}
#scene .tail{fill:#3b1018;transition:fill .3s}
#scene.s-tail .tail{fill:#ff3a3a}
#scene .fogr{fill:#3b1018;transition:fill .3s}
#scene.s-mista .fogr{fill:#ff2a2a}

#scene.s-stand .halo-stand{opacity:calc(.85*var(--hd,1))}
#scene.s-dim .halo-stand,#scene.s-groot .halo-stand{opacity:0}
#scene.s-dim .halo-dim{opacity:calc(.9*var(--hd,1))}
#scene.s-groot .halo-groot{opacity:var(--hd,1)}
#scene.s-mistf .halo-fogf{opacity:calc(.9*var(--hd,1))}
#scene.s-tail .halo-tail{opacity:calc(.8*var(--hd,1))}
#scene.s-mista .halo-fogr{opacity:var(--hd,1)}

#scene.s-groot.s-onc .dazzle{opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}

#scene .rl{font-family:var(--mono);font-size:10px;fill:#9fb0d9;paint-order:stroke;stroke:#05081a;stroke-width:3px;stroke-linejoin:round}

#scene .nightrect{transition:opacity .8s}
#scene.s-day .nightrect{opacity:.05}
#scene #world{transition:filter .8s}
#scene.s-day #world{filter:brightness(2.1) saturate(1.1)}
#scene .glowwrap{transition:opacity .8s}
#scene.s-day .glowwrap{opacity:.2}
#scene.s-day{--hd:.3}
#scene .rig{transform-origin:230px 550px}
#scene.park-in .rig{animation:parkIn 2.6s ease-in-out forwards}
#scene.park-out .rig{animation:parkIn 2.6s ease-in-out reverse forwards}
@keyframes parkIn{
  0%{transform:translate(0,0) rotate(0)}
  40%{transform:translate(42px,6px) rotate(16deg)}
  75%{transform:translate(70px,14px) rotate(6deg)}
  100%{transform:translate(78px,18px) rotate(0)}
}
#scene .scroll{animation:roll 1.4s linear infinite;animation-play-state:paused}
#scene.s-moving .scroll{animation-play-state:running}
@keyframes roll{to{transform:translateY(136px)}}

@media (min-width:900px){
  .app{grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:start}
  .stage{top:16px;padding:0;align-self:start}
  svg.scene{height:clamp(460px,calc(100svh - 130px),800px)}
  .sits{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<div class="page">
  <header class="top">
    <svg class="logo" viewBox="0 0 52 36" aria-hidden="true"><use href="#i-groot"/></svg>
    <div>
      <h1>Autolichten</h1>
      <p>Zet een licht aan. Kijk naar de bundel.</p>
    </div>
  </header>

  <div class="app">
    <section class="stage" aria-label="Weg in het donker">
      <div class="stagebox">
        <svg id="scene" class="scene" viewBox="0 0 360 640" role="img" aria-label="Auto van boven op een donkere weg met de lichtbundels">

    <div class="panel">
      <section>
        <h2 class="h">Lichten</h2>
        <div class="lights" role="group" aria-label="Lichten">
          <button class="light" type="button" data-light="stand" aria-pressed="false">
            <svg class="ico" viewBox="0 0 52 36" aria-hidden="true"><use href="#i-stand"/></svg>
            <span class="sw" aria-hidden="true"></span>
            <span class="name">Standlicht</span>
            <span class="hint">Parkeren in het donker</span>
            <span class="dist">0 m</span>
          </button>
          <button class="light" type="button" data-light="dim" aria-pressed="false">
            <svg class="ico" viewBox="0 0 52 36" aria-hidden="true"><use href="#i-dim"/></svg>
            <span class="sw" aria-hidden="true"></span>
            <span class="name">Dimlicht</span>
            <span class="hint">Rijden in het donker</span>
            <span class="dist">± 30 m</span>
          </button>
          <button class="light blue" type="button" data-light="groot" aria-pressed="false">
            <svg class="ico" viewBox="0 0 52 36" aria-hidden="true"><use href="#i-groot"/></svg>
            <span class="sw" aria-hidden="true"></span>
            <span class="name">Grootlicht</span>
            <span class="hint">Geen tegenligger</span>
            <span class="dist">± 100 m</span>
          </button>
          <button class="light" type="button" data-light="mistf" aria-pressed="false">
            <svg class="ico" viewBox="0 0 52 36" aria-hidden="true"><use href="#i-mistf"/></svg>
            <span class="sw" aria-hidden="true"></span>
            <span class="name">Mistlicht voor</span>
            <span class="hint">Zicht minder dan 100 m</span>
            <span class="dist">± 20 m</span>
          </button>
          <button class="light amber" type="button" data-light="mista" aria-pressed="false">
            <svg class="ico" viewBox="0 0 52 36" aria-hidden="true"><use href="#i-mista"/></svg>
            <span class="sw" aria-hidden="true"></span>
            <span class="name">Mistlicht achter</span>
            <span class="hint">Zicht minder dan 100 m</span>
          </button>
          <button class="alloff" type="button" id="alloff">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-power"/></svg>

          <button class="sit" type="button" data-situation="tegenligger" aria-pressed="false">

          </button>
          <button class="sit" type="button" data-situation="leeg" aria-pressed="false">

          </button>
          <button class="sit" type="button" data-situation="mist" aria-pressed="false">

        <h2 class="h">Op de weg</h2>

          </button>
          <button class="chip" type="button" data-chip="parked" aria-pressed="false">
            <svg class="i24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-park"/></svg><span>Geparkeerd</span>
          </button>
          <button class="chip" type="button" data-chip="day" aria-pressed="false">
            <svg class="i24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun"/></svg><span>Overdag</span>
          </button>
          <button class="chip" type="button" data-chip="onc" aria-pressed="false">
            <svg class="i24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-onc"/></svg><span>Tegenligger</span>
          </button>
          <button class="chip" type="button" data-chip="fog" aria-pressed="false">

          </button>

<script>
(function () {
  var scene = document.getElementById('scene');
  var reachEl = document.getElementById('reach');
  var warnEl = document.getElementById('warn');
  var KEYS = ['stand', 'dim', 'groot', 'mistf', 'mista', 'onc', 'fog', 'day', 'parked'];
  var REACH = { stand: 0, mistf: 20, dim: 30, groot: 100 };
  var FOG_VISIBILITY = 50;
  var s = { stand: false, dim: false, groot: false, mistf: false, mista: false, onc: false, fog: false, day: false, parked: false, moving: true };
  var parkTimer = null;

  var SITUATIONS = {
    parkeren:    { stand: true,  dim: false, groot: false, mistf: false, mista: false, onc: false, fog: false, day: false, parked: true },
    tegenligger: { stand: false, dim: true,  groot: false, mistf: false, mista: false, onc: true,  fog: false, day: false, parked: false },
    leeg:        { stand: false, dim: false, groot: true,  mistf: false, mista: false, onc: false, fog: false, day: false, parked: false },
    mist:        { stand: false, dim: true,  groot: false, mistf: true,  mista: true,  onc: false, fog: true,  day: false, parked: false },
    mistdag:     { stand: false, dim: true,  groot: false, mistf: true,  mista: true,  onc: false, fog: true,  day: true,  parked: false }
  };

  function setParked(p) {
    if (p === s.parked) return;
    s.parked = p;
    clearTimeout(parkTimer);
    scene.classList.remove('park-in', 'park-out');
    void scene.getBoundingClientRect();
    scene.classList.add(p ? 'park-in' : 'park-out');
    if (p) {
      parkTimer = setTimeout(function () {
        if (s.parked) { s.moving = false; render(); }
      }, 1900);
    } else {
      s.moving = true;
    }
  }

  function toggleLight(name) {
    var on = !s[name];
    s[name] = on;
    if (on && name === 'dim') s.groot = false;
    if (on && name === 'groot') s.dim = false;
  }

  function matches(preset) {
    return KEYS.every(function (k) { return s[k] === preset[k]; });
  }

  function render() {
    KEYS.forEach(function (k) { scene.classList.toggle('s-' + k, s[k]); });
    scene.classList.toggle('s-moving', s.moving);
    scene.classList.toggle('s-tail', s.stand || s.dim || s.groot);

    document.querySelectorAll('[data-light]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(s[b.getAttribute('data-light')]));
    });
    document.querySelectorAll('[data-chip]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(s[b.getAttribute('data-chip')]));
    });
    document.querySelectorAll('[data-situation]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(matches(SITUATIONS[b.getAttribute('data-situation')])));
    });

    var text;
    if (s.day) {
      text = s.fog ? '± ' + FOG_VISIBILITY + ' m' : '> 100 m';
    } else {
      var r = 0;
      ['stand', 'dim', 'groot', 'mistf'].forEach(function (k) {
        if (s[k]) r = Math.max(r, REACH[k]);
      });
      if (s.fog) r = Math.min(r, FOG_VISIBILITY);
      text = r === 0 ? '0 m' : '± ' + r + ' m';
    }
    reachEl.textContent = text;

    warnEl.hidden = !(s.groot && s.onc && !s.day);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (t.hasAttribute('data-light')) {
      toggleLight(t.getAttribute('data-light'));
    } else if (t.hasAttribute('data-chip')) {
      var c = t.getAttribute('data-chip');
      if (c === 'parked') {
        setParked(!s.parked);
      } else if (c === 'moving') {
        if (s.parked) setParked(false); else s.moving = !s.moving;
      } else {
        s[c] = !s[c];
      }
    } else if (t.hasAttribute('data-situation')) {
      var p = SITUATIONS[t.getAttribute('data-situation')];
      KEYS.forEach(function (k) { if (k !== 'parked') s[k] = p[k]; });
      setParked(p.parked);
      if (!s.parked) s.moving = true;
    } else if (t.id === 'alloff') {
      ['stand', 'dim', 'groot', 'mistf', 'mista'].forEach(function (k) { s[k] = false; });
    } else {
      return;
    }
    render();
  });

  render();
})();
</script>
